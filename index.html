<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Hangar</title>
<meta name="description" content="Controle de vendas, custos e estoque das bebidas do hangar.">
<meta name="theme-color" content="#820AD1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hangar">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="app">

  <!-- ============ INÍCIO ============ -->
  <section class="screen" id="screen-inicio">
    <header class="topbar">
      <div class="brand">
        <svg class="rotor" viewBox="0 0 100 100" aria-hidden="true"><g stroke="currentColor" stroke-width="9" stroke-linecap="round"><line x1="12" y1="30" x2="88" y2="70"/><line x1="30" y1="88" x2="70" y2="12"/></g><circle cx="50" cy="50" r="11" fill="currentColor"/></svg>
        <div>
          <div class="brand-name">Hangar</div>
          <div class="brand-sub" id="hoje-label">—</div>
        </div>
      </div>
      <button class="icon-btn" id="btn-ajustes" aria-label="Ajustes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.2M12 19v2.2M21.2 12H19M5 12H2.8M18.5 5.5l-1.6 1.6M7.1 16.9l-1.6 1.6M18.5 18.5l-1.6-1.6M7.1 7.1 5.5 5.5"/></svg>
      </button>
    </header>

    <div class="scroll">
      <div class="hero">
        <div class="hero-label">Vendas de hoje</div>
        <div class="hero-value" id="hero-vendas">R$ 0,00</div>
        <div class="hero-row">
          <div><span class="hero-k">Lucro</span><span class="hero-v" id="hero-lucro">R$ 0,00</span></div>
          <div><span class="hero-k">Itens</span><span class="hero-v" id="hero-itens">0</span></div>
          <div><span class="hero-k">Custos</span><span class="hero-v" id="hero-custos">R$ 0,00</span></div>
        </div>
      </div>

      <div class="quick">
        <button class="quick-btn" data-go="vender">
          <span class="q-ico">＋</span>
          <span>Nova venda</span>
        </button>
        <button class="quick-btn" id="q-compra">
          <span class="q-ico">↓</span>
          <span>Registrar compra</span>
        </button>
      </div>

      <div class="section-title">Este mês</div>
      <div class="card stat-card">
        <div class="stat"><span>Vendas</span><b id="mes-vendas">R$ 0,00</b></div>
        <div class="stat"><span>Custos</span><b id="mes-custos" class="neg">R$ 0,00</b></div>
        <div class="stat total"><span>Lucro</span><b id="mes-lucro">R$ 0,00</b></div>
      </div>

      <div class="section-title">Valor em estoque</div>
      <div class="card stat-card">
        <div class="stat"><span>Unidades</span><b id="est-unid">0</b></div>
        <div class="stat"><span>Custo</span><b id="est-custo">R$ 0,00</b></div>
        <div class="stat total"><span>Se vender tudo</span><b id="est-venda">R$ 0,00</b></div>
      </div>

      <div id="alertas"></div>

      <div class="section-title">Últimas vendas</div>
      <div id="ultimas" class="list"></div>
      <div class="spacer"></div>
    </div>
  </section>

  <!-- ============ VENDER ============ -->
  <section class="screen" id="screen-vender" hidden>
    <header class="topbar">
      <div class="page-title">Vender</div>
      <button class="icon-btn" id="btn-limpar-carrinho" aria-label="Limpar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </header>
    <div class="scroll" id="vender-scroll">
      <div class="grid" id="grid-produtos"></div>
      <div class="spacer big"></div>
    </div>
    <div class="cart" id="cart" hidden>
      <div class="cart-info">
        <span id="cart-qtd">0 itens</span>
        <b id="cart-total">R$ 0,00</b>
      </div>
      <button class="btn-primary" id="btn-confirmar">Confirmar venda</button>
    </div>
  </section>

  <!-- ============ PRODUTOS ============ -->
  <section class="screen" id="screen-produtos" hidden>
    <header class="topbar">
      <div class="page-title">Produtos</div>
      <button class="icon-btn" id="btn-add-produto" aria-label="Adicionar produto">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </header>
    <div class="scroll">
      <div class="list" id="lista-produtos"></div>
      <div class="spacer"></div>
    </div>
  </section>

  <!-- ============ AGENDA ============ -->
  <section class="screen" id="screen-agenda" hidden>
    <header class="topbar">
      <div class="page-title">Agenda</div>
    </header>
    <div class="scroll">
      <div class="month-nav">
        <button class="icon-btn" id="mes-prev" aria-label="Mês anterior"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18 9 12l6-6"/></svg></button>
        <div class="month-name" id="mes-nome">—</div>
        <button class="icon-btn" id="mes-next" aria-label="Próximo mês"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
      </div>
      <div class="card stat-card">
        <div class="stat"><span>Vendas</span><b id="cal-vendas">R$ 0,00</b></div>
        <div class="stat"><span>Custos</span><b id="cal-custos" class="neg">R$ 0,00</b></div>
        <div class="stat total"><span>Lucro</span><b id="cal-lucro">R$ 0,00</b></div>
      </div>
      <div class="cal">
        <div class="cal-head"><span>D</span><span>S</span><span>T</span><span>Q</span><span>Q</span><span>S</span><span>S</span></div>
        <div class="cal-grid" id="cal-grid"></div>
      </div>
      <div class="legend"><i class="dot sale"></i> vendas <i class="dot cost"></i> compras</div>
      <div class="spacer"></div>
    </div>
  </section>

</div>

<nav class="tabbar">
  <button class="tab is-active" data-tab="inicio">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/></svg>
    <span>Início</span>
  </button>
  <button class="tab" data-tab="vender">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.6a2 2 0 0 0 2-1.55L21 8H6"/><circle cx="10" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/></svg>
    <span>Vender</span>
  </button>
  <button class="tab" data-tab="produtos">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 7.5 12 3l8.5 4.5v9L12 21l-8.5-4.5z"/><path d="M3.5 7.5 12 12l8.5-4.5M12 12v9"/></svg>
    <span>Produtos</span>
  </button>
  <button class="tab" data-tab="agenda">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="16" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
    <span>Agenda</span>
  </button>
</nav>

<div class="sheet-wrap" id="sheet-wrap" hidden>
  <div class="sheet-bg" id="sheet-bg"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true">
    <div class="sheet-handle"></div>
    <div class="sheet-body" id="sheet-body"></div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="app.js"></script>
</body>
</html>
