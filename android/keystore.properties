# Chave usada para assinar o APK.
#
# E uma chave propria deste projeto, criada so para distribuir o app por fora
# da Play Store (instalacao manual do APK). Ela fica no repositorio de proposito:
# assim toda build sai assinada com a MESMA chave e as atualizacoes instalam por
# cima da versao anterior, sem precisar desinstalar e sem perder a escala salva.
#
# Se um dia o app for publicado na Play Store, gere uma chave nova e privada.
storeFile=escala-apoio.jks
storePassword=escalaapoio
keyAlias=escala
keyPassword=escalaapoio
