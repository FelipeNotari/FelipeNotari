<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Contaí</title>
<meta name="description" content="Contas, gastos e lista de compras num só lugar.">
<meta name="theme-color" content="#FFF5F8">
<meta name="apple-mobile-web-app-capable" content="yes">

<body>

<nav class="abas">

  <button data-tela="relatorio"><span>📊</span>Relatório</button>
  <button data-tela="ajustes"><span>⚙️</span>Ajustes</button>
</nav>

<div class="fundo" id="fundo" hidden></div>
<div class="folha" id="folha" hidden></div>
<div class="aviso" id="aviso" hidden></div>

<script src="app.js"></script>
