<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Comtai</title>
<meta name="description" content="Controle simples das suas finanças.">
<meta name="theme-color" content="#5B4BDB">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Comtai">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topo">
  <div>
    <div class="ola" id="ola">Olá!</div>
    <div class="titulo" id="titulo">Início</div>
  </div>
  <button class="olho" id="btn-olho" aria-label="Mostrar ou esconder valores">👁</button>
</header>

<main id="main"></main>

<button class="fab" id="fab" aria-label="Novo lançamento">+</button>

<nav class="abas">
  <button data-tela="inicio" class="ativa"><span>🏠</span>Início</button>
  <button data-tela="extrato"><span>📋</span>Extrato</button>
  <button data-tela="metas"><span>🎯</span>Metas</button>
  <button data-tela="ajustes"><span>⚙️</span>Ajustes</button>
</nav>

<div class="fundo" id="fundo" hidden></div>
<div class="folha" id="folha" hidden></div>
<div class="aviso" id="aviso" hidden></div>

<script src="app.js"></script>
</body>
</html>
